      c.fillStyle = '#2d4f9a'; rr(c, -7, -10, 14, 20, 6); c.fill(); c.fillStyle = '#e8b894'; c.beginPath(); c.arc(1, 0, 6, 0, 7); c.fill();
      c.fillStyle = '#16213d'; c.beginPath(); c.arc(0, 0, 6.2, Math.PI * 0.55, Math.PI * 1.45); c.lineTo(6, 0); c.fill(); c.restore();
      if (o.sus > 0.05) { c.fillStyle = 'rgba(0,0,0,0.7)'; rr(c, o.x - 16, o.y - 26, 32, 8, 4); c.fill(); c.fillStyle = o.sus > 0.7 ? '#ff4a4a' : '#ffd24a'; rr(c, o.x - 15, o.y - 25, 30 * Math.min(1, o.sus), 6, 3); c.fill(); this.txt('!', o.x, o.y - 30, 14, '#ff4a4a', 'center', '800'); }
    }
    this.drawPlayer(c);
    const obj = this.obj; if (obj && dist(p.x, p.y, obj.x, obj.y) > 50) {
      const a = Math.atan2(obj.y - p.y, obj.x - p.x); c.save(); c.translate(p.x + Math.cos(a) * 30, p.y + Math.sin(a) * 30); c.rotate(a);
      c.fillStyle = 'rgba(255,210,74,0.85)'; c.beginPath(); c.moveTo(7, 0); c.lineTo(-4, -6); c.lineTo(-1, 0); c.lineTo(-4, 6); c.closePath(); c.fill(); c.restore();
    }
    // мерцание терминала
    const T = this.level.terminal; if (T) { c.fillStyle = `rgba(80,255,140,${0.12 + Math.sin(this.t * 6) * 0.04})`; c.fillRect(T.x + 14, T.y + 6, T.w - 28, 26); }
    // табличка «ВЫХОД»
    const E = this.level.exitZone; c.fillStyle = 'rgba(80,255,140,0.18)'; c.fillRect(E.x, E.y, E.w, E.h); this.txt('ВЫХОД', E.x + E.w / 2, E.y + 18, 12, '#9cff9c', 'center', '800');
  }

  /* Освещение: затемнение комнат + «фонарик» вырезается градиентом (маска видимости) */
  drawLighting() {
    const L = this.level, lc = this.lctx, c = this.c, p = this.player, z = this.zoom, d = this.dpr;
    const s = this.light.width / this.w;
    lc.setTransform(1, 0, 0, 1, 0, 0); lc.globalCompositeOperation = 'source-over'; lc.clearRect(0, 0, this.light.width, this.light.height);
    lc.setTransform(s * z, 0, 0, s * z, -this.cam.x * z * s, -this.cam.y * z * s);
    for (const r of L.rooms) if (r.dark > 0) { lc.fillStyle = `rgba(3,4,9,${r.dark})`; lc.fillRect(r.x - 8, r.y - 8, r.w + 16, r.h + 16); }
    lc.globalCompositeOperation = 'destination-out';
    const fx = p.x + p.fx * 34, fy = p.y + p.fy * 34;
    let g = lc.createRadialGradient(fx, fy, 6, fx, fy, 170); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.92)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lc.fillStyle = g; lc.beginPath(); lc.arc(fx, fy, 170, 0, 7); lc.fill();
    g = lc.createRadialGradient(p.x, p.y, 4, p.x, p.y, 62); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lc.fillStyle = g; lc.beginPath(); lc.arc(p.x, p.y, 62, 0, 7); lc.fill();
    lc.globalCompositeOperation = 'source-over';
    c.setTransform(d, 0, 0, d, 0, 0); c.imageSmoothingEnabled = true; c.drawImage(this.light, 0, 0, this.w, this.h);
  }

  /* ---------- HUD ---------- */
  clockStr() {
    const mins = Math.floor(this.time / this.shiftSeconds * 480), t = (22 * 60 + mins) % 1440;
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }
  remainingStain() { return this.stains.reduce((a, b) => a + b.amt, 0); }

  drawHud() {
    const c = this.c, S = this.safe, isGame = this.state === 'game', w = this.w, h = this.h;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    // пауза-кнопка
    const pb = this.pauseBtn; c.fillStyle = 'rgba(10,12,18,0.72)'; c.beginPath(); c.arc(pb.x, pb.y, pb.r, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.fillRect(pb.x - 6, pb.y - 7, 4, 14); c.fillRect(pb.x + 2, pb.y - 7, 4, 14);
    // верхняя левая панель (сдвиг от выреза в ландшафте)
    c.save(); c.translate(S.l, 0);
    if (isGame) {
      const left = this.bodies.filter(b => !b.disposed).length, pct = this.stats.stainTotal ? Math.round((1 - this.remainingStain() / this.stats.stainTotal) * 100) : 100;
      this.panel(10, S.t + 10, 128, 62);
      this.txt(this.clockStr(), 20, S.t + 36, 22, this.shiftOver ? '#ff6a6a' : '#fff', 'left', '800');
      this.txt('Смена ' + this.day, 92, S.t + 31, 11, '#9aa', 'left', '600');
      this.bar(20, S.t + 43, 108, 5, this.time / this.shiftSeconds, '#ffd24a');
      this.txt('Тела ' + (this.bodies.length - left) + '/' + this.bodies.length + ' · Чисто ' + clamp(pct, 0, 100) + '%', 20, S.t + 64, 11, '#cfd6e0', 'left', '600');
    } else {
      this.panel(10, S.t + 10, 128, 40);
      this.txt('УЧАСТОК', 20, S.t + 35, 16, '#9ad0ff', 'left', '800');
    }
    // список жертв
    if (this.victims.length) {
      const top = S.t + (isGame ? 80 : 58), lh = 15, hh = 22 + this.victims.length * lh;
      this.panel(10, top, 138, hh);
      this.txt('Жертвы (' + this.victims.length + ')', 20, top + 16, 11, '#9ad0ff', 'left', '700');
      this.victims.forEach((v, i) => {
        const y = top + 32 + i * lh; this.txt((v.deleted ? '✓ ' : '• ') + v.name, 20, y, 12, v.deleted ? '#7fe07f' : '#fff', 'left', '600');
        if (!v.deleted && v.progress > 0) this.bar(100, y - 8, 40, 5, v.progress, '#9cff9c');
      });
    }
    c.restore();
    // кнопка «Закончить смену»
    if (isGame && (this.obj && this.obj.done || this.shiftOver)) {
      const bw = 140, bx = w / 2 - bw / 2 + 20, by = S.t + 14, pulse = 1 + Math.sin(this.t * 6) * 0.03;
      c.save(); c.translate(bx + bw / 2, by + 20); c.scale(pulse, pulse); c.translate(-bx - bw / 2, -by - 20); this.btn('endshift', 'Закончить ▸', bx, by, bw, 40, true); c.restore();
    }
    // тосты
    this.toasts.forEach((t, i) => {
      const y = S.t + 140 + i * 30 + (isGame ? 0 : -20); c.globalAlpha = Math.min(1, t.t * 2);
      c.font = `600 13px ${FONT}`; const tw = Math.min(w - 20, c.measureText(t.msg).width + 22);
      this.panel(w / 2 - tw / 2, y - 17, tw, 26, 'rgba(10,12,18,0.82)', 13); this.txt(t.msg, w / 2, y + 1, 13, t.col, 'center', '600'); c.globalAlpha = 1;
    });
    // подсказка внизу
    const invY = this.invY;
    if (this.hintText) {
      c.font = `600 13px ${FONT}`; const tw = Math.min(w - 20, c.measureText(this.hintText).width + 24);
      this.panel(w / 2 - tw / 2, invY - 26, tw, 22, 'rgba(10,12,18,0.78)', 11); this.txt(this.hintText, w / 2, invY - 10, 13, '#ffe9a0', 'center', '600');
    }
    if (isGame) { c.save(); c.translate(S.l, 0); this.drawBucketPanel(); c.restore(); }
    if (isGame) this.drawInventory();
    this.drawJoystick(); this.drawActionButton();
  }

  drawBucketPanel() {
    const B = this.bucket, S = this.sponge, y = this.invY - 100; this.panel(10, y, 112, 66);
    this.txt('Ведро' + (B.carried ? '' : ' (на полу)'), 18, y + 15, 11, '#9ad0ff', 'left', '700');
    this.txt('Вода', 18, y + 31, 10, '#cfd6e0', 'left', '600'); this.bar(52, y + 24, 62, 6, B.water, '#4aa8ff');
    this.txt('Грязь', 18, y + 44, 10, '#cfd6e0', 'left', '600'); this.bar(52, y + 37, 62, 6, B.dirt, B.dirt > 0.85 ? '#b04a2a' : '#8a6a3a');
    this.txt('Средство', 18, y + 57, 10, '#cfd6e0', 'left', '600'); this.bar(70, y + 50, 44, 6, B.soap / 1.6, '#7fe07f');
  }

  drawInventory() {
    const c = this.c, w = this.w, y = this.invY, sw = (w - this.safe.l - this.safe.r) / TOOLS.length, X0 = this.safe.l, o = this.obj;
    c.fillStyle = 'rgba(8,10,15,0.94)'; c.fillRect(0, y, w, this.invH); c.fillStyle = 'rgba(255,255,255,0.1)'; c.fillRect(0, y, w, 1);
    TOOLS.forEach((t, i) => {
      const cx = (X0 + i * sw) + sw / 2, cy = y + 28, sel = this.tool === t.id;
      if (sel) { c.fillStyle = 'rgba(224,163,26,0.22)'; rr(c, (X0 + i * sw) + 4, y + 5, sw - 8, 56, 12); c.fill(); c.strokeStyle = '#e0a31a'; c.lineWidth = 2; c.stroke(); }
      else if (o && o.tool === t.id) { const a = 0.35 + Math.sin(this.t * 6) * 0.25; c.strokeStyle = `rgba(255,210,74,${a})`; c.lineWidth = 2; rr(c, (X0 + i * sw) + 4, y + 5, sw - 8, 56, 12); c.stroke(); }
      drawIcon(c, t.id, cx, cy, 15);
      this.txt(t.name, cx, y + 56, 10, sel ? '#ffd47a' : '#aab', 'center', '700');
      if (t.id === 'bag') { c.fillStyle = '#c33'; c.beginPath(); c.arc(cx + 14, y + 12, 8, 0, 7); c.fill(); this.txt(String(this.bags), cx + 14, y + 16, 11, '#fff', 'center', '800'); }
      if (t.id === 'bucket') this.bar((X0 + i * sw) + 14, y + 8, sw - 28, 3, this.bucket.water, '#4aa8ff');
      if (t.id === 'sponge') this.bar((X0 + i * sw) + 14, y + 8, sw - 28, 3, this.sponge.wet, '#e6c93a');
    });
  }

  drawJoystick() {
    const j = this.joy, c = this.c; if (!j.active) return;
    c.fillStyle = 'rgba(255,255,255,0.08)'; c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 2; c.beginPath(); c.arc(j.bx, j.by, 46, 0, 7); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.4)'; const dx = j.x - j.bx, dy = j.y - j.by, m = Math.hypot(dx, dy) || 1, k = Math.min(m, 46) / m;
    c.beginPath(); c.arc(j.bx + dx * k, j.by + dy * k, 22, 0, 7); c.fill();
  }

  drawActionButton() {
    const c = this.c, b = this.actBtn, a = this.act || { kind: 'none' }, active = a.kind !== 'none', held = this.actionHeld && a.kind === 'hold';
    c.globalAlpha = active ? 1 : 0.4;
    c.fillStyle = held ? '#b8861c' : (active ? '#e0a31a' : '#555'); c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill();
    c.strokeStyle = active ? '#ffd47a' : '#888'; c.lineWidth = 3; c.stroke();
    if (a.icon) { drawIcon(c, a.icon, b.x, b.y - 4, 12); this.txt(a.label, b.x, b.y + 28, 11, '#1a1206', 'center', '800'); }
    else this.txt(a.label || '•', b.x, b.y + 5, a.small || (a.label && a.label.length > 7) ? 11 : 15, '#1a1206', 'center', '800');
    // прогресс удержания (упаковка / удаление записи)
    let prog = 0; if (a.kind === 'hold') { const bd = this.bodies.find(x => x.bagProgress > 0); prog = this.state === 'station' ? (this.victims.find(v => v.progress > 0) || { progress: 0 }).progress : (bd ? bd.bagProgress : 0); }
    if (prog > 0) { c.strokeStyle = '#fff'; c.lineWidth = 5; c.beginPath(); c.arc(b.x, b.y, b.r + 6, -Math.PI / 2, -Math.PI / 2 + prog * 6.283); c.stroke(); }
    c.globalAlpha = 1;
  }

  // Колонка кнопок: если экран низкий (iPhone в горизонтали) — кнопки сжимаются, а не вылезают за экран
  stack(top, bottom, n, maxH, gap) { const bh = Math.min(maxH, (bottom - top - gap * (n - 1)) / n); return { bh, step: bh + gap }; }

  drawPause() {
    const c = this.c, w = this.w, h = this.h, land = w > h;
    c.fillStyle = 'rgba(0,0,0,0.7)'; c.fillRect(0, 0, w, h);
    this.txt('Пауза', w / 2, land ? 52 : h * 0.28, land ? 28 : 34, '#fff', 'center', '800');
    const items = [['resume', 'Продолжить', true]];
    if (this.state === 'game') items.push(['finish', 'Закончить смену → участок']);
    items.push(['sound', Save.data.muted ? 'Звук: выкл' : 'Звук: вкл'], ['menu', 'В главное меню']);
    const top = land ? 72 : h * 0.34, L = this.stack(top, h - 16 - this.safe.b, items.length, 52, land ? 10 : 12);
    const bw = Math.min(280, w - 60), bx = w / 2 - bw / 2;
    items.forEach((it, i) => this.btn(it[0], it[1], bx, top + i * L.step, bw, L.bh, !!it[2]));
  }

  drawMenu() {
    const c = this.c, w = this.w, h = this.h, D = Save.data, land = w > h;
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1a0b10'); g.addColorStop(1, '#07080c'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 14; i++) {                                                     // капли, медленно стекающие вниз
      const x = (i * 97 + 30) % w, y = ((this.t * (14 + i * 3) + i * 120) % (h + 60)) - 30;
      c.fillStyle = `rgba(150,15,25,${0.25 + (i % 3) * 0.15})`; c.beginPath(); c.arc(x, y, 3 + i % 4, 0, 7); c.fill(); c.fillRect(x - 1, y - 24, 2, 24);
    }
    if (this.showHelp) { this.drawHelp(); return; }
    const ty = land ? 60 : h * 0.22;
    this.txt('УБОРЩИК', w / 2, ty, Math.min(land ? 44 : 54, w / 7.5), '#f2e6d8', 'center', '900');
    this.txt('служба очистки места происшествия', w / 2, ty + (land ? 22 : 26), 14, '#b88', 'center', '600');
    const bw = Math.min(290, w - 60), bx = w / 2 - bw / 2, top = land ? 120 : h * 0.34;
    this.txt('Деньги: $' + D.money + '  ·  Рекорд: $' + D.best + '  ·  Смена ' + (D.day || 1), w / 2, top - 12, 13, '#cdb', 'center', '600');
    const items = [];
    if (D.shift) items.push(['continue', 'Продолжить смену ' + D.shift.day, true], ['new', 'Новая смена ' + (D.day || 1)]);
    else items.push(['new', 'Начать смену ' + (D.day || 1), true]);
    items.push(['help', 'Как играть'], ['sound', D.muted ? 'Звук: выкл' : 'Звук: вкл']);
    const L = this.stack(top, h - (land ? 34 : 50) - this.safe.b, items.length, 56, land ? 8 : 12);
    items.forEach((it, i) => this.btn(it[0], it[1], bx, top + i * L.step, bw, L.bh, !!it[2]));
    this.txt('Для лучшего опыта: Поделиться → На экран «Домой»', w / 2, h - (land ? 10 : 28) - this.safe.b, 11, '#778', 'center', '600');
  }

  // «Как играть»: прокручиваемый список; кнопка «Назад» закреплена внизу и ничего не перекрывает
  drawHelp() {
    const c = this.c, w = this.w, h = this.h, S = this.safe, land = w > h;
    const items = [
      ['Левый палец', 'джойстик (появляется там, где коснулся)'],
      ['Жёлтая кнопка', 'контекстное действие; для упаковки, мытья и удаления — держи'],
      ['Нижняя панель', 'выбор инструмента'],
      ['1. Телефон', 'подойди к телу → «Снять» (запишет жертву)'],
      ['2. Мешок', 'возьми со стопки; тело держи 3 сек (кнопкой или пальцем по телу)'],
      ['3. Руки', 'сними с кровати, возьми упакованное тело, неси к машине'],
      ['4. Ведро', 'набери воду у раковины, добавь средство из бутылки'],
      ['5. Швабра / Губка', 'пол — шваброй, стены и потолок — губкой'],
      ['6. Участок', 'после смены удали записи жертв, не попавшись полицейскому']
    ];
    const px = 14 + S.l, pw = w - 28 - S.l - S.r, tw = pw - 28;
    const top = S.t + (land ? 46 : 70), backH = 48, backY = h - S.b - backH - 12, bottom = backY - 10;
    this.txt('Как играть', w / 2, S.t + (land ? 32 : 48), land ? 20 : 24, '#fff', 'center', '800');
    c.font = `500 12px ${FONT}`;                                                      // перенос строк по реальной ширине
    const rows = items.map(it => {
      const lines = []; let line = '';
      for (const wd of it[1].split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && c.measureText(t).width > tw) { lines.push(line); line = wd; } else line = t; }
      if (line) lines.push(line);
      return { title: it[0], lines, h: 36 + lines.length * 15 };
    });
    const contentH = rows.reduce((a, r) => a + r.h, 0) + 8;
    this.helpMax = Math.max(0, contentH - (bottom - top));
    this.helpScroll = clamp(this.helpScroll || 0, 0, this.helpMax);
    c.save(); c.beginPath(); c.rect(0, top, w, bottom - top); c.clip();
    this.panel(px, top - this.helpScroll, pw, contentH, 'rgba(10,12,18,0.7)', 14);
    let y = top - this.helpScroll + 8;
    for (const r of rows) {
      this.txt(r.title, px + 14, y + 16, 14, '#ffd47a', 'left', '800');
      r.lines.forEach((ln, k) => this.txt(ln, px + 14, y + 34 + k * 15, 12, '#dde', 'left', '500'));
      y += r.h;
    }
    c.restore();
    if (this.helpMax > 0) {                                                          // полоса прокрутки
      const vh = bottom - top, th = Math.max(24, vh * vh / contentH), ty2 = top + (vh - th) * (this.helpScroll / this.helpMax);
      c.fillStyle = 'rgba(255,255,255,0.35)'; rr(c, w - 7 - S.r, ty2, 3, th, 1.5); c.fill();
    }
    const bw = Math.min(290, w - 60); this.btn('help', 'Назад', w / 2 - bw / 2, backY, bw, backH, true);
  }

  drawReport() {
    const c = this.c, w = this.w, h = this.h, r = this.report, S = this.safe, land = w > h; if (!r) return;
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0e1420'); g.addColorStop(1, '#07080c'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    let stars = ''; for (let i = 0; i < 5; i++) stars += i < r.stars ? '★' : '☆';
    const n = r.lines.length, rowH = land ? 28 : 30, ph = n * rowH + 20;
    // В портрете всё в одну колонку, в ландшафте: слева таблица, справа итог и кнопки
    const px = land ? 14 + S.l : 18, pw = land ? w / 2 - 22 - S.l : w - 36, py = land ? 14 : S.t + 120;
    const cx = land ? w * 0.75 : w / 2, bw = Math.min(290, land ? w / 2 - 30 - S.r : w - 60), bx = cx - bw / 2;
    this.txt('Конец смены ' + r.day, cx, land ? 48 : S.t + 60, land ? 26 : 30, '#fff', 'center', '800');
    this.txt(stars, cx, land ? 88 : S.t + 100, land ? 28 : 32, '#ffd24a', 'center', '700');
    this.panel(px, py, pw, ph, 'rgba(255,255,255,0.07)', 14);
    r.lines.forEach((l, i) => { const y = py + 32 + i * rowH; this.txt(l[0], px + 14, y, 14, '#dde', 'left', '600'); if (l[1] !== 0) this.txt((l[1] > 0 ? '+' : '') + l[1] + ' $', px + pw - 14, y, 14, l[1] > 0 ? '#7fe07f' : '#ff8a7a', 'right', '700'); });
    const ty = land ? 140 : py + ph + 44;
    this.txt('Заработано: $' + r.pay, cx, ty, 28, '#ffd47a', 'center', '800'); this.txt('Всего денег: $' + Save.data.money, cx, ty + 26, 14, '#aab', 'center', '600');
    if (land) { this.btn('next', 'Следующая смена', bx, 190, bw, 48, true); this.btn('menu', 'В главное меню', bx, 246, bw, 46); }
    else { this.btn('next', 'Следующая смена', bx, h - 150 - S.b, bw, 54, true); this.btn('menu', 'В главное меню', bx, h - 86 - S.b, bw, 50); }
  }

  /* ---------- главный цикл ---------- */
  frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - (this.last || now)) / 1000)); this.last = now;
    this.update(dt); this.draw();
  }
}

/* ---------------------------------------------------------------- ЗАПУСК */
function boot() {
  const canvas = document.getElementById('game'), game = new Game(canvas); window.__game = game;
  const loop = now => { game.frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  // PWA: офлайн-режим (service worker работает только по https или localhost)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();

})();
</script>
</body>
